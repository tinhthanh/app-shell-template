name: ci

on:
  # labeled/unlabeled: the guardrails job reads the PR's labels.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Tooltips are the app's own, never the HTML title attribute.
      - run: pnpm check:titles
      # Modules the unit tests load run in node as they are.
      - run: pnpm check:node
      # Every view, settings section and shortcut is wired end to end.
      - run: pnpm check:views
      # Every built-in theme's text and states meet their contrast
      # (src/themes/contrast.ts).
      - run: pnpm check:themes
      - run: pnpm test
      # The node-run modules stay covered: lines 90%, branches and functions 80%.
      - run: pnpm test:coverage
      - run: pnpm build
      # The browser suite (e2e/): the production build in Playwright's
      # Chromium, on the mock fixtures, with no page error allowed.
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm exec playwright test
        env:
          E2E_WORKERS: "2"
          # axe in the light theme too (e2e/a11y.spec.ts).
          A11Y_FULL: "1"
          # The HTML report and JUnit file are the run's evidence (playwright.config.ts).
          E2E_REPORT: "1"
      # The report and, on failure, the traces: what a PR links to as proof.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: |
            node_modules/.e2e-report
            node_modules/.e2e-results
          include-hidden-files: true
          retention-days: 14

  # A pull request's proof: a behaviour change has a test, a user-visible
  # one a changelog bullet, the title a conventional subject
  # (scripts/check-evidence.mjs). The PR's text reaches the script through
  # env only, never through the shell.
  evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: node scripts/check-evidence.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}

  # Nothing skips a test or edits a check unnoticed (scripts/check-guardrails.mjs).
  guardrails:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: node scripts/check-guardrails.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
