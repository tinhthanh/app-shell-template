name: ci

on:
  # labeled/unlabeled: the guardrails job reads the PR's labels.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Tooltips are the app's own, never the HTML title attribute.
      - run: pnpm check:titles
      # Modules the unit tests load run in node as they are.
      - run: pnpm check:node
      # Every view, settings section and shortcut is wired end to end.
      - run: pnpm check:views
      # Every built-in theme's text and states meet their contrast
      # (src/themes/contrast.ts).
      - run: pnpm check:themes
      - run: pnpm test
      # The node-run modules stay covered: lines 90%, branches and functions 80%.
      - run: pnpm test:coverage
      - run: pnpm build
      # The browser suite (e2e/): the production build in Playwright's
      # Chromium, on the mock fixtures, with no page error allowed.
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm exec playwright test
        env:
          E2E_WORKERS: "2"
          # axe in the light theme too (e2e/a11y.spec.ts).
          A11Y_FULL: "1"
          # The HTML report and JUnit file are the run's evidence (playwright.config.ts).
          E2E_REPORT: "1"
      # The report and, on failure, the traces: what a PR links to as proof.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            node_modules/.e2e-report
            node_modules/.e2e-results
          include-hidden-files: true
          retention-days: 14

  # A pull request's proof: a behaviour change has a test, a user-visible
  # one a changelog bullet, the title a conventional subject
  # (scripts/check-evidence.mjs). The PR's text reaches the script through
  # env only, never through the shell.
  evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: node scripts/check-evidence.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}

  # Nothing skips a test or edits a check unnoticed (scripts/check-guardrails.mjs).
  guardrails:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: node scripts/check-guardrails.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
