name: codeql

# GitHub's code scanning on the app's TypeScript and the scripts, on every
# pull request, on main, and weekly (a new query finds old code). Findings
# show under Security › Code scanning and on the PR's diff. Free on a
# public repository; a private one needs GitHub Advanced Security, so there
# the job stays off (a red check on every PR otherwise) until the
# repository variable CODEQL is set to "on".
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ !github.event.repository.private || vars.CODEQL == 'on' }}
    runs-on: ubuntu-latest
    permissions:
      # A private repository's run is read through the API.
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # TypeScript and JavaScript need no build to be analysed.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
