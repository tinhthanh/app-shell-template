name: pages

# Publishes dist/ to GitHub Pages on every push to main. The site runs on
# the fixtures unless the repository variable API_URL names an API; set
# the variable MOCK to 1 to say the fixtures are what you want (a demo),
# or the job refuses to publish an unconfigured app.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refuse to publish an app nobody configured
        env:
          API_URL: ${{ vars.API_URL }}
          MOCK: ${{ vars.MOCK }}
        run: |
          if [ -z "$API_URL" ] && [ "$MOCK" != "1" ]; then
            echo "::error::set the repository variable API_URL, or MOCK=1 to publish the demo on its fixtures"
            exit 1
          fi
      - run: pnpm build
        env:
          APP_COMMIT: ${{ github.sha }}
          VITE_API_URL: ${{ vars.API_URL }}
          # A demo keeps the URL knobs (?mock=1, ?crash=…) so its states can be shown.
          VITE_KNOBS: ${{ vars.MOCK == '1' && '1' || '' }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
