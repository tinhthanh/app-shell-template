name: release

# A tag vX.Y.Z (pushed after the "chore: release X.Y.Z" PR from
# scripts/release.mjs merged) becomes a GitHub release: the checks, the
# build, dist as a tarball, and the changelog's section as the notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag names the version package.json has
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm check
      - run: pnpm build
        env:
          APP_COMMIT: ${{ github.sha }}
          SOURCEMAPS: "1"
      - run: tar -czf "app-$GITHUB_REF_NAME.tar.gz" -C dist .
      - name: The changelog's section for this version
        run: awk -v h="## ${GITHUB_REF_NAME#v}" 'index($0,h)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md && test -s notes.md
      - run: gh release create "$GITHUB_REF_NAME" "app-$GITHUB_REF_NAME.tar.gz" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
