# The headers every response carries (docs/deploy.md). The policy is
# deploy/csp.txt's; keep them the same (pnpm check:csp checks that file).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-6iUiy1UK7N/gArkgyEYT0cBn/SbgYsLUUeS15+Qyjns='; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://api.example.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
