# The headers every response carries (docs/deploy.md). The policy is
# deploy/csp.txt's, with the API's origin filled in at start (entrypoint.sh); pnpm check:csp keeps them the same.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-6iUiy1UK7N/gArkgyEYT0cBn/SbgYsLUUeS15+Qyjns='; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' __API_ORIGIN__; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
