<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Shell</title>
    <!-- The appearance the last theme had (themes/apply.ts keeps it in
         app.appearance), or the system's, before the first paint: no flash of
         the wrong colours while the app starts. -->
    <script>
      (function () {
        var dark = true;
        try {
          var saved = localStorage.getItem("app.appearance");
          dark = saved ? saved === '"dark"' : matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {}
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
